<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="460" height="290" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect x="0" y="0" width="460" height="290" fill="#ffffff"/>
  <!-- water: front face and side face below level, top surface -->
  <polygon points="70,130 310,130 310,230 70,230" fill="#bfe0f5"/>
  <polygon points="310,130 370,90 370,190 310,230" fill="#a9d3ef"/>
  <polygon points="70,130 130,90 370,90 310,130" fill="#d6ecfa"/>
  <!-- back edges (hidden) -->
  <g stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="130" y1="30" x2="130" y2="190"/>
    <line x1="130" y1="190" x2="70" y2="230"/>
    <line x1="130" y1="190" x2="370" y2="190"/>
  </g>
  <!-- visible edges -->
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="70" y="70" width="240" height="160"/>
    <polyline points="70,70 130,30 370,30 310,70"/>
    <polyline points="370,30 370,190 310,230"/>
  </g>
  <!-- water line -->
  <polyline points="70,130 310,130 370,90" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <!-- dimension: 60 cm -->
  <line x1="70" y1="252" x2="310" y2="252" stroke="#222" stroke-width="1.2"/>
  <line x1="70" y1="246" x2="70" y2="258" stroke="#222" stroke-width="1.2"/>
  <line x1="310" y1="246" x2="310" y2="258" stroke="#222" stroke-width="1.2"/>
  <text x="190" y="274" text-anchor="middle">60 cm</text>
  <!-- dimension: 40 cm -->
  <line x1="48" y1="70" x2="48" y2="230" stroke="#222" stroke-width="1.2"/>
  <line x1="42" y1="70" x2="54" y2="70" stroke="#222" stroke-width="1.2"/>
  <line x1="42" y1="230" x2="54" y2="230" stroke="#222" stroke-width="1.2"/>
  <text x="40" y="155" text-anchor="end">40 cm</text>
  <!-- dimension: 30 cm (depth) -->
  <text x="352" y="228" transform="rotate(-33 352 228)">30 cm</text>
  <!-- dimension: 25 cm water -->
  <line x1="392" y1="90" x2="392" y2="190" stroke="#1f5fa8" stroke-width="1.2"/>
  <line x1="386" y1="90" x2="398" y2="90" stroke="#1f5fa8" stroke-width="1.2"/>
  <line x1="386" y1="190" x2="398" y2="190" stroke="#1f5fa8" stroke-width="1.2"/>
  <text x="400" y="145" fill="#1f5fa8">25 cm</text>
  <text x="190" y="185" text-anchor="middle" fill="#1f5fa8">água</text>
</svg>
