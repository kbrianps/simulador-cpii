<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>
  <!-- lawn -->
  <rect x="60" y="40" width="360" height="240" fill="#bfe3b4"/>
  <!-- paths -->
  <rect x="60" y="145" width="360" height="30" fill="#e8d7b0"/>
  <polygon points="120,280 150,280 330,40 300,40" fill="#e8d7b0"/>
  <g stroke="#8a6d3b" stroke-width="1.2" fill="none">
    <line x1="60" y1="145" x2="420" y2="145"/>
    <line x1="60" y1="175" x2="420" y2="175"/>
    <line x1="120" y1="280" x2="300" y2="40"/>
    <line x1="150" y1="280" x2="330" y2="40"/>
  </g>
  <rect x="60" y="40" width="360" height="240" fill="none" stroke="#222" stroke-width="2.5"/>
  <!-- bottom dims -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="60" y1="292" x2="150" y2="292"/>
    <line x1="60" y1="286" x2="60" y2="298"/><line x1="120" y1="286" x2="120" y2="298"/><line x1="150" y1="286" x2="150" y2="298"/>
    <line x1="60" y1="328" x2="420" y2="328"/>
    <line x1="60" y1="322" x2="60" y2="334"/><line x1="420" y1="322" x2="420" y2="334"/>
  </g>
  <text x="90" y="308" text-anchor="middle" font-size="14">2 m</text>
  <text x="135" y="308" text-anchor="middle" font-size="14">1 m</text>
  <text x="300" y="322" text-anchor="middle">12 m</text>
  <!-- top dims -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="300" y1="28" x2="420" y2="28"/>
    <line x1="300" y1="22" x2="300" y2="34"/><line x1="330" y1="22" x2="330" y2="34"/><line x1="420" y1="22" x2="420" y2="34"/>
  </g>
  <text x="315" y="18" text-anchor="middle" font-size="14">1 m</text>
  <text x="375" y="18" text-anchor="middle" font-size="14">3 m</text>
  <!-- left dim -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="44" y1="40" x2="44" y2="280"/>
    <line x1="38" y1="40" x2="50" y2="40"/><line x1="38" y1="280" x2="50" y2="280"/>
  </g>
  <text x="36" y="165" text-anchor="end">8 m</text>
  <!-- right dim for horizontal path -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="432" y1="145" x2="432" y2="175"/>
    <line x1="426" y1="145" x2="438" y2="145"/><line x1="426" y1="175" x2="438" y2="175"/>
  </g>
  <text x="442" y="165" font-size="14">1 m</text>
  <text x="200" y="100" text-anchor="middle" fill="#2e6b2a">gramado</text>
</svg>
