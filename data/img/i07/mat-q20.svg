<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" width="380" height="330" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect x="0" y="0" width="380" height="330" fill="#ffffff"/>
  <!-- water body -->
  <path d="M 80 104 L 80 280 A 110 26 0 0 0 300 280 L 300 104 Z" fill="#bfe0f5"/>
  <ellipse cx="190" cy="104" rx="110" ry="26" fill="#9fcdeb" stroke="#2a6f9e" stroke-width="1.5"/>
  <!-- tank outline -->
  <line x1="80" y1="60" x2="80" y2="280" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="280" stroke="#222" stroke-width="2"/>
  <ellipse cx="190" cy="60" rx="110" ry="26" fill="none" stroke="#222" stroke-width="2"/>
  <path d="M 80 280 A 110 26 0 0 0 300 280" fill="none" stroke="#222" stroke-width="2"/>
  <path d="M 80 280 A 110 26 0 0 1 300 280" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- diameter -->
  <line x1="80" y1="60" x2="300" y2="60" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="190" cy="60" r="2.5" fill="#c0392b"/>
  <text x="190" y="52" text-anchor="middle" fill="#c0392b">2 m</text>
  <!-- total height -->
  <line x1="330" y1="60" x2="330" y2="280" stroke="#222" stroke-width="1"/>
  <line x1="323" y1="60" x2="337" y2="60" stroke="#222" stroke-width="1"/>
  <line x1="323" y1="280" x2="337" y2="280" stroke="#222" stroke-width="1"/>
  <text x="340" y="175">1,5 m</text>
  <!-- water height -->
  <line x1="50" y1="104" x2="50" y2="280" stroke="#2a6f9e" stroke-width="1"/>
  <line x1="43" y1="104" x2="57" y2="104" stroke="#2a6f9e" stroke-width="1"/>
  <line x1="43" y1="280" x2="57" y2="280" stroke="#2a6f9e" stroke-width="1"/>
  <text x="44" y="198" text-anchor="end" fill="#2a6f9e">1,2 m</text>
  <text x="190" y="200" text-anchor="middle" fill="#1d4f73">água</text>
  <text x="190" y="322" text-anchor="middle">caixa-d’água</text>
</svg>
