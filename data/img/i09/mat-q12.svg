<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="440" height="300" fill="#fff"/>
  <line x1="10" y1="270" x2="430" y2="270" stroke="#000" stroke-width="2"/>
  <!-- boy -->
  <circle cx="60" cy="200" r="11" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="211" x2="60" y2="245" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="245" x2="48" y2="270" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="245" x2="72" y2="270" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="222" x2="78" y2="232" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="222" x2="45" y2="238" stroke="#000" stroke-width="2"/>
  <circle cx="80" cy="233" r="3" fill="#000"/>
  <text x="44" y="290">Lucas</text>
  <!-- kite -->
  <polygon points="360,22 378,44 360,74 342,44" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
  <path d="M360,74 q-6,12 4,20 q8,8 -2,18" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- string -->
  <line x1="80" y1="233" x2="360" y2="74" stroke="#000" stroke-width="2"/>
  <text x="175" y="162" transform="rotate(-29.6 175 162)">linha: 50 m</text>
  <!-- dashed -->
  <line x1="360" y1="74" x2="360" y2="270" stroke="#000" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="80" y1="233" x2="360" y2="233" stroke="#000" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polyline points="346,233 346,219 360,219" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="206" y="252">30 m</text>
  <!-- hand height -->
  <line x1="100" y1="233" x2="100" y2="270" stroke="#000" stroke-width="1"/>
  <line x1="95" y1="233" x2="105" y2="233" stroke="#000" stroke-width="1"/>
  <line x1="95" y1="270" x2="105" y2="270" stroke="#000" stroke-width="1"/>
  <text x="106" y="258">1,5 m</text>
  <line x1="395" y1="74" x2="395" y2="270" stroke="#000" stroke-width="1"/>
  <line x1="390" y1="74" x2="400" y2="74" stroke="#000" stroke-width="1"/>
  <line x1="390" y1="270" x2="400" y2="270" stroke="#000" stroke-width="1"/>
  <line x1="378" y1="74" x2="400" y2="74" stroke="#000" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="403" y="178" font-style="italic">h</text>
</svg>
