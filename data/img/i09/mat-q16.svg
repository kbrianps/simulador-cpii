<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="480" height="300" fill="#fff"/>
  <!-- wall -->
  <rect x="420" y="20" width="14" height="250" fill="#d9d9d9" stroke="#000" stroke-width="1.5"/>
  <text x="400" y="290">parede</text>
  <!-- projector -->
  <rect x="20" y="138" width="44" height="24" rx="3" fill="#bdbdbd" stroke="#000" stroke-width="1.5"/>
  <circle cx="64" cy="150" r="5" fill="#000"/>
  <text x="14" y="185">projetor</text>
  <!-- light cone -->
  <line x1="64" y1="150" x2="420" y2="54" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="64" y1="150" x2="420" y2="246" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="420" y1="54" x2="420" y2="246" stroke="#000" stroke-width="4"/>
  <line x1="64" y1="150" x2="420" y2="150" stroke="#000" stroke-width="1"/>
  <text x="345" y="100">imagem:</text>
  <text x="355" y="120">2,4 m</text>
  <text x="200" y="172">4,5 m</text>
</svg>
